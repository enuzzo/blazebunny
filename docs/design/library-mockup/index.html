<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blazebunny · organization mockup</title>
<style>
@font-face { font-family: "Space Grotesk"; src: url("fonts/SpaceGrotesk-wght.ttf") format("truetype"); font-weight: 300 700; }
@font-face { font-family: "Space Mono"; src: url("fonts/SpaceMono-Regular.ttf") format("truetype"); font-weight: 400; }
@font-face { font-family: "Space Mono"; src: url("fonts/SpaceMono-Bold.ttf") format("truetype"); font-weight: 700; }
:root {
  --window: #0C0D0F; --hair: rgba(255,255,255,.09); --rule: rgba(255,255,255,.10); --stroke: rgba(255,255,255,.20);
  --t1: rgba(255,255,255,.86); --t2: rgba(255,255,255,.55); --glass: rgba(255,255,255,.045); --solid: #18191C;
  --accent: #3E8BFF; --accent-fill: rgba(62,139,255,.20); --accent-text: #8DB8FF;
  --ghost: #F2B861; --warn: #F57361; --bar: rgba(255,255,255,.45); --track: rgba(255,255,255,.08);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: #050506; color: var(--t1); font: 400 13px/1.3 "Space Grotesk", -apple-system, system-ui, sans-serif;
  display: flex; flex-direction: column; gap: 10px; padding: 10px 12px 12px; user-select: none; -webkit-user-select: none; overflow: hidden; }
.mono { font-family: "Space Mono", ui-monospace, monospace; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
svg.i { display: block; flex: none; }

/* Mockup controls: outside the app window */
.demo { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--t2); }
.demo b { font-weight: 600; color: var(--t1); margin-right: 4px; }
.demo button { height: 24px; padding: 0 9px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--stroke); color: var(--t1); font-size: 12px; }
.demo button:hover { background: rgba(255,255,255,.07); }
.demo button.on { background: var(--accent-fill); color: var(--accent-text); box-shadow: none; }
.demo .gap { width: 10px; }
.demo .hint { margin-left: auto; font-size: 11px; }

/* Window */
.window { position: relative; flex: 1; min-height: 0; display: grid; grid-template-rows: minmax(0,1fr); grid-template-columns: 264px minmax(0,1fr) 272px; border-radius: 14px; overflow: hidden;
  background: radial-gradient(900px 520px at 8% -12%, rgba(76,87,115,.38), transparent 62%), radial-gradient(700px 420px at 100% 110%, rgba(76,87,115,.14), transparent 60%), var(--window);
  box-shadow: 0 0 0 1px rgba(255,255,255,.10), 0 30px 80px rgba(0,0,0,.6); }
@media (max-width: 1180px) { .window { grid-template-columns: 264px minmax(0,1fr); } .insp { display: none !important; } }

/* Sidebar */
.sidebar { display: flex; flex-direction: column; min-height: 0; background: rgba(255,255,255,.035); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-right: 1px solid var(--hair); }
.lights { display: flex; gap: 8px; padding: 14px 14px 10px; } .lights i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.16); }
.swwrap { padding: 0 10px 8px; position: relative; }
.switcher { width: 100%; height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 10px; border-radius: 8px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--hair); text-align: left; }
.switcher:hover, .switcher.open { background: rgba(255,255,255,.08); }
.switcher .nm { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.switcher .ct { font: 10.5px "Space Mono"; color: var(--t2); }
.switcher .ud { color: var(--t2); }
.switcher.ghost { box-shadow: none; border: 1px dashed rgba(242,184,97,.7); color: var(--ghost); }
.switcher.drop-into { box-shadow: inset 0 0 0 1.5px var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.sbscroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 8px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; }
.sect { height: 26px; margin-top: 10px; display: flex; align-items: center; padding: 0 8px 0 8px; color: var(--t2); font-size: 11px; font-weight: 600; }
.sect .st { flex: 1; display: flex; align-items: center; gap: 6px; }
.sect .sadd { width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; color: var(--t2); opacity: 0; }
.sidebar:hover .sect .sadd { opacity: 1; } .sect .sadd:hover { background: rgba(255,255,255,.09); color: var(--t1); }
.sect.gh { color: var(--ghost); }
.row { height: 28px; display: flex; align-items: center; padding-right: 6px; border-radius: 6px; position: relative; }
.row:hover { background: rgba(255,255,255,.05); }
.row.sel { background: var(--accent-fill); }
.row .chev { width: 14px; height: 28px; flex: none; display: grid; place-items: center; color: var(--t2); }
.row .chev svg { transition: transform .15s; } .row .chev.open svg { transform: rotate(90deg); }
.row .ic { width: 20px; flex: none; display: grid; place-items: center; color: var(--t2); margin-right: 10px; }
.row .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .ct { font: 10.5px "Space Mono"; color: var(--t2); margin-left: 8px; }
.row .tag { font-size: 10px; color: var(--t2); margin-left: 6px; white-space: nowrap; }
.row .more { width: 20px; height: 20px; border-radius: 5px; display: none; place-items: center; color: var(--t2); margin-left: 2px; }
.row:hover .more { display: grid; } .row:hover .ct.hideable { display: none; } .row .more:hover { background: rgba(255,255,255,.10); color: var(--t1); }
.row.off .nm { color: var(--t2); } .row.off.top .ic { color: var(--warn); }
.row.grp .nm { color: var(--t2); }
.row.drop-into { box-shadow: inset 0 0 0 1.5px var(--accent); background: var(--accent-fill); }
.row.drop-deny { box-shadow: inset 0 0 0 1px var(--warn); }
.row.ghostrow { border: 1px dashed rgba(242,184,97,.7); color: var(--ghost); } .row.ghostrow .ic { color: var(--ghost); }
.row input.rn, .librow input.rn { flex: 1; min-width: 0; height: 22px; font: inherit; color: var(--t1); background: rgba(0,0,0,.4); border: 0; outline: 1.5px solid var(--accent); border-radius: 4px; padding: 0 5px; user-select: text; -webkit-user-select: text; }
.scan { height: 2px; position: absolute; left: 44px; right: 8px; bottom: 2px; background: var(--track); border-radius: 1px; overflow: hidden; } .scan i { display: block; height: 100%; background: var(--bar); }
.empty { padding: 4px 10px 6px 44px; color: var(--t2); font-size: 11px; line-height: 1.35; }

/* Tray: docked at the bottom of the sidebar */
.tray { margin: 0 10px 8px; border-radius: 10px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--hair); padding: 2px 4px 4px; }
.tray .th { height: 28px; display: flex; align-items: center; padding: 0 4px 0 6px; }
.tray .th .ic { width: 20px; display: grid; place-items: center; color: var(--t2); margin-right: 8px; }
.tray .th .nm { flex: 1; font-weight: 500; } .tray .th .ct { font: 10.5px "Space Mono"; color: var(--t2); margin-right: 6px; }
.tray .tb { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 6px 6px; }
.tray .mini { width: 26px; height: 26px; border-radius: 4px; position: relative; }
.tray .mini:hover::after { content: "×"; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.6); border-radius: 4px; font-size: 13px; }
.tray .morect { height: 26px; padding: 0 6px; display: grid; place-items: center; font: 10.5px "Space Mono"; color: var(--t2); }
.tray .ta { display: flex; gap: 6px; padding: 0 6px 4px; }
.tray .hint { padding: 0 8px 6px 34px; color: var(--t2); font-size: 11px; line-height: 1.35; }
.tray.drop-into { box-shadow: inset 0 0 0 1.5px var(--accent); background: var(--accent-fill); }
body.drag-tile .tray { box-shadow: inset 0 0 0 1px var(--accent); }
.btn { height: 24px; padding: 0 10px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--stroke); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: rgba(255,255,255,.07); } .btn.pri { background: var(--accent); box-shadow: none; color: #fff; font-weight: 500; } .btn.pri:hover { filter: brightness(1.1); }
.btn[disabled] { opacity: .4; pointer-events: none; } .btn.big { height: 28px; padding: 0 14px; font-size: 13px; }
.btn.amber { color: var(--ghost); box-shadow: inset 0 0 0 1px rgba(242,184,97,.5); } .btn.danger { color: var(--warn); }
.sbbottom { height: 40px; flex: none; display: flex; align-items: center; padding: 0 12px; border-top: 1px solid var(--hair); color: var(--t2); }
.sbbottom .add { display: flex; align-items: center; gap: 8px; color: var(--t1); height: 28px; padding: 0 8px 0 6px; border-radius: 6px; } .sbbottom .add:hover { background: rgba(255,255,255,.06); }
.sbbottom .gb { margin-left: auto; width: 28px; height: 28px; display: grid; place-items: center; color: var(--ghost); border-radius: 6px; } .sbbottom .gb:hover { background: rgba(242,184,97,.12); }

/* Content */
.content { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.content.ghost::after { content: ""; position: absolute; inset: 5px; border: 1.5px dashed rgba(242,184,97,.7); border-radius: 12px; pointer-events: none; }
.header { height: 52px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--hair); min-width: 0; }
.ttl { display: flex; flex-direction: column; justify-content: center; min-width: 0; flex: 0 1 auto; }
.scopeline { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--t2); height: 14px; white-space: nowrap; }
.scopeline .cr:hover { color: var(--t1); text-decoration: underline; } .scopeline .k { font-weight: 600; } .scopeline .am { color: var(--ghost); } .scopeline .wn { color: var(--warn); }
.scopeline .lv { color: var(--accent-text); }
.title { font-size: 20px; font-weight: 500; letter-spacing: -.3px; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: baseline; gap: 10px; }
.title .n { font: 11.5px "Space Mono"; color: var(--t2); letter-spacing: 0; } .title .u { font-size: 12px; color: var(--t2); letter-spacing: 0; margin-left: -4px; font-weight: 400; }
.pills { display: flex; gap: 8px; min-width: 0; overflow: hidden; flex: 1 1 auto; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
.pill { height: 28px; padding: 0 10px; border-radius: 14px; box-shadow: inset 0 0 0 1px var(--stroke); display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--t2); white-space: nowrap; flex: none; }
.pill:hover { background: rgba(255,255,255,.06); } .pill.on { background: var(--accent-fill); box-shadow: none; color: var(--accent-text); } .pill.save { color: var(--accent-text); box-shadow: inset 0 0 0 1px rgba(62,139,255,.5); }
.search { position: relative; flex: none; width: 232px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.06); display: flex; align-items: center; gap: 6px; padding: 0 4px 0 8px; color: var(--t2); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font: inherit; font-size: 12px; color: var(--t1); user-select: text; -webkit-user-select: text; }
.search .sc { height: 20px; padding: 0 7px; border-radius: 5px; background: rgba(255,255,255,.08); font-size: 11px; color: var(--t1); display: inline-flex; align-items: center; gap: 4px; max-width: 120px; overflow: hidden; white-space: nowrap; }
.grid { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 24px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; }
.month { display: flex; align-items: baseline; gap: 8px; padding: 14px 0 8px; font-weight: 600; } .month .n { font: 10.5px "Space Mono"; color: var(--t2); font-weight: 400; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.tile { aspect-ratio: 1; border-radius: 8px; display: grid; place-items: center; background: rgba(255,255,255,.025); }
.tile .ph { border-radius: 5px; max-width: 100%; max-height: 100%; }
.tile.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.tile.intray { box-shadow: 0 0 0 1px rgba(255,255,255,.5); }
.emptymain { height: 100%; display: grid; place-items: center; text-align: center; color: var(--t2); } .emptymain h3 { font-size: 20px; font-weight: 500; color: var(--t1); margin: 0 0 6px; letter-spacing: -.3px; } .emptymain p { margin: 0 0 14px; }
.footer { height: 32px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-top: 1px solid var(--hair); font-size: 12px; color: var(--t2); }
.footer .n { font: 11.5px "Space Mono"; color: var(--t1); } .footer .r { margin-left: auto; display: flex; align-items: center; gap: 6px; } .footer .wn { color: var(--warn); } .footer .am { color: var(--ghost); }

/* Inspector (no glass) */
.insp { border-left: 1px solid var(--hair); padding: 52px 16px 16px; overflow-y: auto; min-height: 0; scrollbar-width: thin; }
.cap { font-size: 10px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--t2); margin: 18px 0 6px; }
.hero { display: flex; align-items: baseline; gap: 8px; } .hero .d { font: 40px/1 "Space Mono"; letter-spacing: -1px; } .hero .u { color: var(--t2); }
.irow { height: 28px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--rule); font-size: 12px; }
.irow .l { flex: 1; min-width: 0; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .irow .v { font: 11.5px "Space Mono"; }
.irow .bar { width: 64px; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; flex: none; } .irow .bar i { display: block; height: 100%; min-width: 2px; background: var(--bar); }
.irow .wn { color: var(--warn); display: grid; }
.selbox { border-radius: 10px; box-shadow: inset 0 0 0 1px var(--hair); background: var(--glass); padding: 10px; margin-bottom: 4px; } .selbox .a { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.note { font-size: 11px; color: var(--t2); line-height: 1.4; margin-top: 8px; } .note.am { color: var(--ghost); }

/* Popovers, menus, sheets */
#ov { position: absolute; inset: 0; z-index: 20; pointer-events: none; } #ov > * { pointer-events: auto; }
.pop { position: fixed; z-index: 30; background: rgba(24,25,28,.94); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-radius: 12px; box-shadow: 0 0 0 1px var(--stroke), 0 18px 50px rgba(0,0,0,.6); padding: 6px; }
.swpop { width: 312px; }
.swpop .find { height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 7px; background: rgba(255,255,255,.06); color: var(--t2); margin-bottom: 6px; }
.swpop .find input { flex: 1; background: none; border: 0; outline: 0; font: inherit; font-size: 12px; color: var(--t1); user-select: text; -webkit-user-select: text; }
.plabel { padding: 8px 8px 4px; font-size: 11px; font-weight: 600; color: var(--t2); display: flex; align-items: center; gap: 6px; } .plabel.am { color: var(--ghost); }
.librow { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 8px; border-radius: 7px; position: relative; }
.librow:hover { background: rgba(255,255,255,.06); } .librow.cur { background: var(--accent-fill); } .librow.drop-into { box-shadow: inset 0 0 0 1.5px var(--accent); background: var(--accent-fill); }
.librow .ic { width: 20px; display: grid; place-items: center; }
.librow .tx { flex: 1; min-width: 0; } .librow .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; } .librow .mt { font-size: 11px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.librow .mt .wn { color: var(--warn); }
.librow .ct { font: 10.5px "Space Mono"; color: var(--t2); } .librow .kb { font: 10.5px "Space Mono"; color: var(--t2); width: 22px; text-align: right; }
.librow .more { width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; color: var(--t2); } .librow .more:hover { background: rgba(255,255,255,.10); color: var(--t1); }
.librow.gh { border: 1px dashed rgba(242,184,97,.7); color: var(--ghost); } .librow.gh .mt { color: rgba(242,184,97,.75); }
.psep { height: 1px; background: var(--rule); margin: 6px 4px; }
.mi { height: 26px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 6px; font-size: 13px; white-space: nowrap; }
.mi:hover { background: var(--accent); color: #fff; } .mi .ic { width: 16px; display: grid; place-items: center; color: var(--t2); } .mi:hover .ic, .mi:hover .k { color: #fff; }
.mi .k { margin-left: auto; padding-left: 18px; font: 10.5px "Space Mono"; color: var(--t2); } .mi.danger { color: var(--warn); } .mi.dis { opacity: .4; pointer-events: none; } .mi.sub { padding-left: 26px; }
.mi.amber { color: var(--ghost); } .mi.amber .ic { color: var(--ghost); }
.mnote { padding: 4px 10px 6px; font-size: 11px; color: var(--t2); max-width: 250px; white-space: normal; line-height: 1.35; }
.sw { display: flex; gap: 7px; padding: 6px 10px 8px; } .sw i { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); } .sw i:hover { transform: scale(1.2); } .sw i.on { box-shadow: 0 0 0 2px var(--solid), 0 0 0 3.5px rgba(255,255,255,.7); }
.menu { min-width: 216px; }
.scrim { position: absolute; inset: 0; z-index: 20; background: rgba(0,0,0,.45); display: grid; place-items: center; }
.sheet { width: 468px; background: rgba(24,25,28,.96); backdrop-filter: blur(24px); border-radius: 16px; box-shadow: 0 0 0 1px var(--stroke), 0 30px 80px rgba(0,0,0,.7); padding: 20px; }
.sheet h2 { font-size: 13px; font-weight: 600; margin: 0 0 4px; } .sheet .p { font: 11.5px "Space Mono"; color: var(--t2); margin-bottom: 4px; word-break: break-all; }
.sheet .f { font-size: 12px; color: var(--t2); margin-bottom: 14px; line-height: 1.45; } .sheet .f .n { font: 11.5px "Space Mono"; color: var(--t1); }
.opt { display: flex; gap: 10px; padding: 9px 10px; border-radius: 9px; box-shadow: inset 0 0 0 1px var(--hair); margin-bottom: 8px; align-items: flex-start; }
.opt:hover { background: rgba(255,255,255,.04); } .opt.on { box-shadow: inset 0 0 0 1.5px var(--accent); background: rgba(62,139,255,.08); }
.opt.gh.on { box-shadow: none; border: 1.5px dashed var(--ghost); background: rgba(242,184,97,.07); padding: 7.5px 8.5px; }
.opt .rd { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--stroke); margin-top: 2px; flex: none; } .opt.on .rd { box-shadow: inset 0 0 0 4.5px var(--accent); } .opt.gh.on .rd { box-shadow: inset 0 0 0 4.5px var(--ghost); }
.opt .ot { font-weight: 500; } .opt .od { font-size: 11px; color: var(--t2); margin-top: 2px; line-height: 1.4; } .opt.gh .ot { color: var(--ghost); }
.sheet .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.toast { position: absolute; z-index: 25; left: 50%; bottom: 46px; transform: translateX(-50%); background: rgba(24,25,28,.96); box-shadow: 0 0 0 1px var(--stroke), 0 12px 30px rgba(0,0,0,.5); border-radius: 10px; padding: 8px 8px 8px 14px; display: flex; align-items: center; gap: 12px; font-size: 12px; max-width: 560px; }
.toast .btn { height: 22px; }
.cmp { position: absolute; inset: 0; z-index: 10; background: #000; display: flex; flex-direction: column; }
.cmp .bar { height: 52px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--hair); } .cmp .bar .t { font-size: 20px; font-weight: 500; letter-spacing: -.3px; } .cmp .bar .n { font: 11.5px "Space Mono"; color: var(--t2); flex: 1; }
.cmp .panes { flex: 1; min-height: 0; display: grid; gap: 2px; padding: 2px; } .cmp .pane { display: grid; place-items: center; background: #08090A; position: relative; min-height: 0; overflow: hidden; }
.cmp .pane .ph { width: 78%; max-height: 82%; border-radius: 4px; } .cmp .pane .lb { position: absolute; left: 10px; bottom: 8px; font: 10.5px "Space Mono"; color: var(--t2); }
.allres { position: absolute; right: 0; top: 34px; width: 280px; z-index: 15; }

/* Dragging */
#chip { position: fixed; z-index: 50; pointer-events: none; display: none; height: 26px; padding: 0 10px; border-radius: 13px; background: rgba(24,25,28,.96); box-shadow: 0 0 0 1px var(--stroke), 0 8px 20px rgba(0,0,0,.5); align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; }
#chip .w { color: var(--warn); }
#ins { position: fixed; z-index: 49; height: 2px; border-radius: 1px; background: var(--accent); pointer-events: none; display: none; }
#ins::before { content: ""; position: absolute; left: -3px; top: -2px; width: 6px; height: 6px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--accent); background: var(--window); }
body.dragging, body.dragging * { cursor: grabbing !important; }
</style>
</head>
<body>
<div class="demo" id="demo"></div>
<div class="window" id="win">
  <aside class="sidebar" id="sb"></aside>
  <main class="content" id="content">
    <header class="header" id="hd"></header>
    <section class="grid" id="grid"></section>
    <footer class="footer" id="ft"></footer>
    <div id="cmp"></div>
  </main>
  <aside class="insp" id="insp"></aside>
  <div id="ov"></div>
</div>
